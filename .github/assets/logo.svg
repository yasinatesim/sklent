<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sklent - Agent Bootstrap">
  <defs>
    <linearGradient id="grad-primary" x1="30" y1="30" x2="170" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="55%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0f1a2e"/>
    </linearGradient>
    <linearGradient id="grad-core" x1="82" y1="82" x2="118" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="200" height="200" rx="44" fill="url(#grad-bg)"/>

  <!-- hexagonal frame: skeleton/bootstrap structure -->
  <path d="M100 34 L156 67 L156 133 L100 166 L44 133 L44 67 Z"
        fill="none" stroke="url(#grad-primary)" stroke-width="3" stroke-linejoin="round" opacity="0.9"/>

  <!-- spokes from core to each vertex -->
  <g stroke-width="2" stroke-linecap="round" opacity="0.55">
    <line x1="100" y1="100" x2="100" y2="34" stroke="#06b6d4"/>
    <line x1="100" y1="100" x2="156" y2="67" stroke="#22c55e"/>
    <line x1="100" y1="100" x2="156" y2="133" stroke="#10b981"/>
    <line x1="100" y1="100" x2="100" y2="166" stroke="#ec4899"/>
    <line x1="100" y1="100" x2="44" y2="133" stroke="#db2777"/>
    <line x1="100" y1="100" x2="44" y2="67" stroke="#06b6d4"/>
  </g>

  <!-- vertex nodes -->
  <g stroke="#0b1220" stroke-width="2.5">
    <circle cx="100" cy="34" r="6" fill="#06b6d4"/>
    <circle cx="156" cy="67" r="6" fill="#34d399"/>
    <circle cx="156" cy="133" r="6" fill="#10b981"/>
    <circle cx="100" cy="166" r="6" fill="#ec4899"/>
    <circle cx="44" cy="133" r="6" fill="#db2777"/>
    <circle cx="44" cy="67" r="6" fill="#0891b2"/>
  </g>

  <!-- core: the bootstrap agent, a pillow badge marked with the Sklent initial -->
  <path d="M 84 70
           L 116 70
           Q 121 79 130 84
           L 130 116
           Q 121 121 116 130
           L 84 130
           Q 79 121 70 116
           L 70 84
           Q 79 79 84 70 Z"
        fill="url(#grad-core)" stroke="#0b1220" stroke-width="3" stroke-linejoin="round"
        filter="url(#soft-glow)"/>
</svg>
