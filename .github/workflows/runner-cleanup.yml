name: Runner cleanup

# Self-hosted only pays off on a PRIVATE repo (metered Actions minutes); this repo is public, so ci.yml uses ubuntu-latest and this workflow has no runner to target.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prune docker
        run: |
          docker container prune -f
          docker image prune -af --filter "until=72h"
          docker builder prune -af --filter "until=72h"
          docker volume prune -f
      - name: Report disk
        run: df -h /
