name: Security

permissions:
  contents: read

on:
  push:
    branches: [master, development]
  schedule:
    - cron: '0 2 * * 1'

jobs:
  secrets-scan:
    name: Secrets Scan (Gitleaks)
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks (with checksum verification)
        run: |
          GITLEAKS_VERSION=8.27.2
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          BASE_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL "${BASE_URL}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/gitleaks_checksums.txt
          curl -sSfL "${BASE_URL}/${TARBALL}" -o "/tmp/${TARBALL}"
          grep "${TARBALL}" /tmp/gitleaks_checksums.txt | (cd /tmp && sha256sum --check)
          tar -xzf "/tmp/${TARBALL}" -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Detect secrets
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1

  sast-go:
    name: SAST — Go (Semgrep)
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: python -m pip install setuptools semgrep==1.93.0

      - name: Scan Go source
        # warning-only: findings are uploaded as artifacts, not blocking
        run: |
          semgrep \
            --config p/golang \
            --config p/owasp-top-ten \
            examples/e-commerce/api/ \
            --json \
            --output semgrep-go.json \
            --no-error
        continue-on-error: true

      - name: Upload Go scan results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: semgrep-go-results
          path: semgrep-go.json
          retention-days: 30

  sast-ts:
    name: SAST — TypeScript (Semgrep)
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: python -m pip install setuptools semgrep==1.93.0

      - name: Scan TypeScript/React source
        # warning-only: findings are uploaded as artifacts, not blocking
        run: |
          semgrep \
            --config p/typescript \
            --config p/react \
            --config p/owasp-top-ten \
            examples/e-commerce/web/src/ \
            --json \
            --output semgrep-ts.json \
            --no-error
        continue-on-error: true

      - name: Upload TS scan results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: semgrep-ts-results
          path: semgrep-ts.json
          retention-days: 30
