[extend]
useDefault = true

# Path-scoped allowlist: suppression rules apply only within test/example files
# to avoid masking real secrets that happen to mention "example" in a variable name.
[[allowlists]]
description = "Test and example file false positives"
paths = [
  '''(\.env\..*\.example|\.env\.example)$''',
  '''.env\.example''',
  '''\.env\.local\.example''',
  '''testdata/''',
  '''fixtures/''',
  '''__tests__/''',
  '''_test\.go$''',
  '''\.claude/memory/''',
  # Playwright saved session state (gitignored; only ever holds test JWTs)
  '''e2e/\.auth/''',
]
regexes = [
  '''your[_-]?key|your[_-]?secret|your[_-]?token|placeholder|changeme|CHANGE_ME''',
  '''test_?secret|fake_?key|dummy_?token|mock_?password''',
  # Sequential hex placeholder — not a real secret
  '''0123456789abcdef0123456789abcdef''',
]
stopwords = [
  "example",
  "placeholder",
  "changeme",
  "your_key",
  "your_secret",
  "test_secret",
  "fake_key",
]
